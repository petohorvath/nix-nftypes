name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1; upstream Nix
      - name: Allow unshare to create user namespaces
        run: |
          sudo cp .github/apparmor/nix-unshare /etc/apparmor.d/nix-unshare
          sudo apparmor_parser -r /etc/apparmor.d/nix-unshare
      - name: Check review environment
        run: bash tooling/review-env.sh true
      - run: nix flake check -L

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1; upstream Nix
      - run: nix fmt -- --ci
