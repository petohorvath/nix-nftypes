name: Upstream sync

# Watches the nftables packages that the project policy's stable and unstable
# pins carry (docs/upstream-sync.md). The job reads the pins from the policy
# checker that check.yml calls, overrides the single `nixpkgs` input with each
# pin, and compares the locked input's fully patched nftables source tree with
# the pin's. While they differ, one GitHub issue per pin carries the current
# report. All source material comes through nixpkgs; there is no independent
# upstream Git pin. The policy's Pin-bump tests run the checks with proposed
# pins before their release, so this workflow runs no tests.

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read
  issues: write

env:
  # The policy series that check.yml calls; its checker bundles the pins.
  POLICY: github:petohorvath/nixos-project-policy/v0.6

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  nixpkgs-source-watch:
    strategy:
      fail-fast: false
      matrix:
        label: [stable, unstable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1; upstream Nix

      - name: Compare locked and pinned nftables sources
        id: source
        shell: bash
        run: |
          set -euo pipefail

          locked_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          policy_report=$(nix run "$POLICY" -- validate)
          checker_version=$(jq -er .checkerVersion <<<"$policy_report")
          pin_rev=$(jq -er --arg label "${{ matrix.label }}" '.pins[$label]' <<<"$policy_report")
          pin_uri="github:NixOS/nixpkgs/$pin_rev"
          source_ref=.#packages.x86_64-linux.nftables-source

          locked_source=$(nix build --no-link --print-out-paths "$source_ref")
          pin_source=$(nix build --no-link --print-out-paths \
            --override-input nixpkgs "$pin_uri" \
            "$source_ref")
          test -d "$locked_source"
          test -d "$pin_source"

          locked_version=$(nix eval --raw "$source_ref.version")
          pin_version=$(nix eval --raw \
            --override-input nixpkgs "$pin_uri" \
            "$source_ref.version")
          locked_hash=$(nix hash path --type sha256 --base16 "$locked_source")
          pin_hash=$(nix hash path --type sha256 --base16 "$pin_source")

          {
            echo "locked_rev=$locked_rev"
            echo "checker_version=$checker_version"
            echo "pin_rev=$pin_rev"
            echo "locked_version=$locked_version"
            echo "pin_version=$pin_version"
            echo "locked_hash=$locked_hash"
            echo "pin_hash=$pin_hash"
          } >>"$GITHUB_OUTPUT"

          if [ "$locked_hash" = "$pin_hash" ]; then
            echo "drift=false" >>"$GITHUB_OUTPUT"
            echo "No nftables source drift for the ${{ matrix.label }} pin: $locked_version ($locked_hash)."
          else
            echo "drift=true" >>"$GITHUB_OUTPUT"
            echo "nftables source drift for the ${{ matrix.label }} pin: $locked_version ($locked_hash) -> $pin_version ($pin_hash)."

            # List the changed files relative to the tree roots. The trailing
            # slashes follow the root links; --no-dereference compares the
            # links inside the trees instead of failing on dangling ones.
            ln -s "$locked_source" "$RUNNER_TEMP/locked"
            ln -s "$pin_source" "$RUNNER_TEMP/pinned"
            status=0
            (cd "$RUNNER_TEMP" && diff -rq --no-dereference locked/ pinned/) \
              >"$RUNNER_TEMP/diff-rq.txt" || status=$?
            [ "$status" -le 1 ] || exit "$status"
            sed -E \
              -e 's|^Files locked/(.*) and pinned/.* differ$|changed: \1|' \
              -e 's|^Only in locked: |removed: |' \
              -e 's|^Only in locked/(.*): |removed: \1/|' \
              -e 's|^Only in pinned: |added: |' \
              -e 's|^Only in pinned/(.*): |added: \1/|' \
              "$RUNNER_TEMP/diff-rq.txt" | sort -k2 >"$RUNNER_TEMP/changed-files.txt"
            echo "changed files: $(wc -l <"$RUNNER_TEMP/changed-files.txt")"
          fi

          {
            echo "### ${{ matrix.label }} nftables source comparison"
            echo
            echo "Pins from nixos-project-policy $checker_version."
            echo
            echo "| | nixpkgs revision | nftables | patched-source SHA-256 |"
            echo "|---|---|---|---|"
            echo "| locked | \`${locked_rev:0:12}\` | \`$locked_version\` | \`${locked_hash:0:16}…\` |"
            echo "| ${{ matrix.label }} pin | \`${pin_rev:0:12}\` | \`$pin_version\` | \`${pin_hash:0:16}…\` |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Update the drift issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ matrix.label }}
          DRIFT: ${{ steps.source.outputs.drift }}
          CHECKER_VERSION: ${{ steps.source.outputs.checker_version }}
          LOCKED_REV: ${{ steps.source.outputs.locked_rev }}
          PIN_REV: ${{ steps.source.outputs.pin_rev }}
          LOCKED_VERSION: ${{ steps.source.outputs.locked_version }}
          PIN_VERSION: ${{ steps.source.outputs.pin_version }}
          LOCKED_HASH: ${{ steps.source.outputs.locked_hash }}
          PIN_HASH: ${{ steps.source.outputs.pin_hash }}
        run: |
          set -euo pipefail
          label=nixpkgs-nftables-drift
          title="nixpkgs nftables drift ($PIN)"

          # The open drift issues of this pin, oldest first; normally at most
          # one. Issues filed before the title dropped the hash are titled
          # "$title: <hash>"; adopting one renames it.
          issues=$(gh issue list --state open --label "$label" \
            --limit 100 --json number,title,body \
            | jq -c --arg title "$title" \
              '[.[] | select(.title == $title or (.title | startswith($title + ": ")))]
               | sort_by(.number)')

          if [ "$DRIFT" = false ]; then
            numbers=$(jq -r '.[].number' <<<"$issues")
            if [ -z "$numbers" ]; then
              echo "No open $PIN drift issue needs closing."
              exit 0
            fi
            while IFS= read -r number; do
              gh issue close "$number" --reason completed --comment \
                "Resolved: the locked and $PIN pin patched nftables sources now match at ${PIN_HASH:0:12}."
            done <<<"$numbers"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/changed-files.txt"
          changed_count=$(wc -l <"$changed_files")
          max_listed_files=300
          {
            echo "<!-- pinned-hash: $PIN_HASH -->"
            echo "The patched nftables source at the $PIN pin of nixos-project-policy \`$CHECKER_VERSION\` differs from the lock. This issue carries the latest report and closes when the sources match again."
            echo
            echo "| | nixpkgs revision | nftables | patched-source SHA-256 |"
            echo "|---|---|---|---|"
            echo "| locked | \`$LOCKED_REV\` | \`$LOCKED_VERSION\` | \`$LOCKED_HASH\` |"
            echo "| $PIN pin | \`$PIN_REV\` | \`$PIN_VERSION\` | \`$PIN_HASH\` |"
            echo
            echo "## Changed files"
            echo
            if [ "$changed_count" -eq 0 ]; then
              echo "No file contents differ; the trees differ in file modes or other metadata."
            else
              echo '```text'
              head -n "$max_listed_files" "$changed_files"
              echo '```'
            fi
            if [ "$changed_count" -gt "$max_listed_files" ]; then
              echo
              echo "The list shows $max_listed_files of $changed_count changed files."
            fi
            echo
            echo "## Full diff"
            echo
            echo '```sh'
            echo "diff -ru \$(nix build --no-link --print-out-paths .#nftables-source) \\"
            echo "         \$(nix build --no-link --print-out-paths .#nftables-source --override-input nixpkgs github:NixOS/nixpkgs/$PIN_REV)"
            echo '```'
          } >"$RUNNER_TEMP/drift-report.md"

          gh label create "$label" --force --color FBCA04 \
            --description "A policy pin carries nftables source different from the lock"

          issue=$(jq -c 'first // empty' <<<"$issues")
          if [ -z "$issue" ]; then
            gh issue create --title "$title" --label "$label" \
              --body-file "$RUNNER_TEMP/drift-report.md"
            exit 0
          fi

          number=$(jq -r .number <<<"$issue")
          reported_hash=$(jq -r .body <<<"$issue" | tr -d '\r' \
            | sed -nE 's/^<!-- pinned-hash: ([0-9a-f]+) -->$/\1/p')
          gh issue edit "$number" --title "$title" \
            --body-file "$RUNNER_TEMP/drift-report.md"
          # Edits send no notification, so a new pinned source also comments.
          if [ "$reported_hash" != "$PIN_HASH" ]; then
            gh issue comment "$number" --body \
              "The $PIN pin now carries patched source \`${PIN_HASH:0:12}\` (nftables $PIN_VERSION); the issue body has the new report."
          else
            echo "Issue #$number already reports ${PIN_HASH:0:12}; refreshed its body."
          fi
