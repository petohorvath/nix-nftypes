name: Upstream sync

# Keeps the schema in step with the nftables packages consumers receive from
# the stable and unstable nixpkgs branches (docs/upstream-sync.md). Each job
# overrides the single `nixpkgs` input with the current tip of each branch:
#
#   nixpkgs-source-watch — compares the locked input's fully patched nftables
#     source tree with the same package at the branch's current tip.
#     A content change produces a parser diff and a GitHub issue. All source
#     material comes through nixpkgs; there is no independent upstream Git pin.
#
#   canary — runs live-parser, patched-source, enum, corpus, and round-trip
#     checks against an immutable snapshot of each branch's current tip.
#     continue-on-error keeps this an early-warning signal rather than a gate.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  nixpkgs-source-watch:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The stable branch is the branch of `inputs.nixpkgs.url` in flake.nix.
          - branch: nixos-26.05
            label: stable
          - branch: nixos-unstable
            label: unstable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1; upstream Nix

      - name: Compare locked and branch-tip nftables sources
        id: source
        shell: bash
        run: |
          set -euo pipefail

          locked_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          tip_rev=$(nix flake metadata --json "github:NixOS/nixpkgs/${{ matrix.branch }}" | jq -er .revision)
          tip_uri="github:NixOS/nixpkgs/$tip_rev"
          source_ref=.#packages.x86_64-linux.nftables-source

          locked_source=$(nix build --no-link --print-out-paths "$source_ref")
          tip_source=$(nix build --no-link --print-out-paths \
            --override-input nixpkgs "$tip_uri" \
            "$source_ref")
          test -d "$locked_source"
          test -d "$tip_source"

          locked_version=$(nix eval --raw "$source_ref.version")
          tip_version=$(nix eval --raw \
            --override-input nixpkgs "$tip_uri" \
            "$source_ref.version")
          locked_hash=$(nix hash path --type sha256 --base16 "$locked_source")
          tip_hash=$(nix hash path --type sha256 --base16 "$tip_source")

          printf '%s\n' "$locked_source" >"$RUNNER_TEMP/locked-nftables-source"
          printf '%s\n' "$tip_source" >"$RUNNER_TEMP/tip-nftables-source"
          {
            echo "locked_rev=$locked_rev"
            echo "tip_rev=$tip_rev"
            echo "locked_version=$locked_version"
            echo "tip_version=$tip_version"
            echo "locked_hash=$locked_hash"
            echo "tip_hash=$tip_hash"
          } >>"$GITHUB_OUTPUT"

          if [ "$locked_hash" = "$tip_hash" ]; then
            echo "drift=false" >>"$GITHUB_OUTPUT"
            echo "No nftables source drift for ${{ matrix.branch }}: $locked_version ($locked_hash)."
          else
            echo "drift=true" >>"$GITHUB_OUTPUT"
            echo "nftables source drift for ${{ matrix.branch }}: $locked_version ($locked_hash) -> $tip_version ($tip_hash)."
          fi

          {
            echo "### ${{ matrix.label }} nftables source comparison"
            echo
            echo "| | nixpkgs revision | nftables | patched-source SHA-256 |"
            echo "|---|---|---|---|"
            echo "| locked | \`${locked_rev:0:12}\` | \`$locked_version\` | \`${locked_hash:0:16}…\` |"
            echo "| tip | \`${tip_rev:0:12}\` | \`$tip_version\` | \`${tip_hash:0:16}…\` |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Close resolved drift issues
        if: steps.source.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED_HASH: ${{ steps.source.outputs.locked_hash }}
          TIP_HASH: ${{ steps.source.outputs.tip_hash }}
        run: |
          set -euo pipefail
          label=nixpkgs-nftables-drift
          label_exists=$(gh label list --limit 1000 --json name \
            | jq -r --arg label "$label" 'any(.[]; .name == $label)')
          if [ "$label_exists" != true ]; then
            echo "No $label label exists; there are no drift issues to close."
            exit 0
          fi

          title_prefix="nixpkgs nftables drift (${{ matrix.label }}): "
          issues=$(gh issue list --state open --label "$label" \
            --limit 100 --json number,title \
            | jq -r --arg prefix "$title_prefix" '.[] | select(.title | startswith($prefix)) | .number')
          if [ -z "$issues" ]; then
            echo "No open ${{ matrix.label }} drift issues need closing."
            exit 0
          fi

          while IFS= read -r issue; do
            gh issue close "$issue" --reason completed --comment \
              "Resolved: the locked and branch-tip patched nftables sources now match at ${TIP_HASH:0:12} (locked ${LOCKED_HASH:0:12})."
          done <<<"$issues"

      - name: Diff schema-relevant source files
        if: steps.source.outputs.drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          locked_source=$(<"$RUNNER_TEMP/locked-nftables-source")
          tip_source=$(<"$RUNNER_TEMP/tip-nftables-source")
          files=(
            src/parser_json.c
            src/json.c
            src/meta.c
            src/rt.c
            src/parser_bison.y
            src/scanner.l
            doc/libnftables-json.adoc
          )

          : >parser.diff
          for file in "${files[@]}"; do
            locked_file="$locked_source/$file"
            tip_file="$tip_source/$file"
            [ -e "$locked_file" ] || locked_file=/dev/null
            [ -e "$tip_file" ] || tip_file=/dev/null
            if diff -u \
              --label "locked/$file" "$locked_file" \
              --label "tip/$file" "$tip_file" >>parser.diff; then
              :
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
            fi
          done
          echo "diff bytes: $(wc -c <parser.diff)"

      - name: Upload source diff
        if: steps.source.outputs.drift == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nftables-source-diff-${{ matrix.label }}
          path: parser.diff
          if-no-files-found: error

      - name: AI-assisted drift triage
        if: steps.source.outputs.drift == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_basic_report() {
            local reason=$1
            cat >drift-report.md <<EOF
          # nixpkgs nftables source drift detected

          Branch: \`${{ matrix.branch }}\`

          - Locked nixpkgs: \`${{ steps.source.outputs.locked_rev }}\`
          - Branch tip: \`${{ steps.source.outputs.tip_rev }}\`
          - nftables: \`${{ steps.source.outputs.locked_version }}\` → \`${{ steps.source.outputs.tip_version }}\`
          - Patched source: \`${{ steps.source.outputs.locked_hash }}\` → \`${{ steps.source.outputs.tip_hash }}\`

          $reason The schema-relevant source diff is attached to the workflow run.
          EOF
          }

          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            write_basic_report "AI triage was skipped because no \`ANTHROPIC_API_KEY\` secret is configured."
          elif ! bash tooling/drift-triage.sh \
            --diff parser.diff \
            --schema-dir lib/schema \
            --spec-coverage docs/spec-coverage.md \
            --old-source "nixpkgs:${{ steps.source.outputs.locked_hash }}" \
            --new-source "${{ matrix.branch }}:${{ steps.source.outputs.tip_hash }}" \
            --out drift-report.md; then
            write_basic_report "AI triage failed; the deterministic source comparison remains authoritative."
          fi

      - name: File or update drift issue
        if: steps.source.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TIP_HASH: ${{ steps.source.outputs.tip_hash }}
        run: |
          set -euo pipefail
          title="nixpkgs nftables drift (${{ matrix.label }}): ${TIP_HASH:0:12}"
          gh label create nixpkgs-nftables-drift --color FBCA04 \
            --description "A nixpkgs branch carries nftables source different from the lock" 2>/dev/null || true
          existing=$(gh issue list --state open --label nixpkgs-nftables-drift \
            --limit 100 --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already tracks $TIP_HASH; appending a fresh report."
            gh issue comment "$existing" --body-file drift-report.md
          else
            gh issue create --title "$title" --label nixpkgs-nftables-drift --body-file drift-report.md
          fi

  canary:
    strategy:
      fail-fast: false # let each branch report independently
      matrix:
        include:
          # The stable branch is the branch of `inputs.nixpkgs.url` in flake.nix.
          - branch: nixos-26.05
            label: stable
          - branch: nixos-unstable
            label: unstable
    runs-on: ubuntu-latest
    continue-on-error: true # non-gating: a red canary is a signal, not a failure
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1; upstream Nix
        with:
          enable_kvm: true # the live-parser tests run in a NixOS VM
      # Resolve the branch once, then override with that immutable revision so
      # every evaluation in this job sees exactly the same package set.
      - name: Compatibility suite vs latest ${{ matrix.branch }} nftables
        shell: bash
        run: |
          set -euo pipefail
          locked_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          tip_rev=$(nix flake metadata --json "github:NixOS/nixpkgs/${{ matrix.branch }}" | jq -er .revision)
          tip_uri="github:NixOS/nixpkgs/$tip_rev"

          {
            echo "### ${{ matrix.label }} branch-tip compatibility"
            echo
            echo "nixpkgs revision: \`$tip_rev\`."
          } >>"$GITHUB_STEP_SUMMARY"

          source_ref=.#packages.x86_64-linux.nftables-source
          locked_version=$(nix eval --raw "$source_ref.version")
          tip_version=$(nix eval --raw \
            --override-input nixpkgs "$tip_uri" \
            "$source_ref.version")

          echo "Overriding nixpkgs from ${locked_rev:0:12} to ${{ matrix.branch }} at ${tip_rev:0:12}."
          echo "nftables package version: $locked_version -> $tip_version"
          echo "nftables version: \`$tip_version\`." >>"$GITHUB_STEP_SUMMARY"

          vm_tests=(
            integration-tests
            text-integration-tests
            text-block-integration-tests
            render-equivalence-tests
            nftables-roundtrip-tests
          )
          checks=(
            nftables-source-provenance-tests
            nftables-corpus-tests
            nftables-enum-extraction-tests
            nftables-tooling-selftests
          )
          targets=()
          for test in "${vm_tests[@]}"; do
            targets+=(".#legacyPackages.x86_64-linux.vmTests.${test}")
          done
          for check in "${checks[@]}"; do
            targets+=(".#checks.x86_64-linux.${check}")
          done

          nix build -L \
            --override-input nixpkgs "$tip_uri" \
            "${targets[@]}"

          echo "Passed ${#targets[@]} nftables-facing tests." >>"$GITHUB_STEP_SUMMARY"
