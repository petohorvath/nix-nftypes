name: Upstream sync

# Watches the nftables packages that the project policy's stable and unstable
# pins carry (docs/upstream-sync.md). The job reads the pins from the policy
# checker that check.yml calls, overrides the single `nixpkgs` input with each
# pin, and compares the locked input's fully patched nftables source tree with
# the pin's. A content change produces a parser diff and a GitHub issue. All
# source material comes through nixpkgs; there is no independent upstream Git
# pin. The policy's Pin-bump tests run the checks with proposed pins before
# their release, so this workflow runs no tests.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read
  issues: write

env:
  # The policy series that check.yml calls; its checker bundles the pins.
  POLICY: github:petohorvath/nixos-project-policy/v0.6

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  nixpkgs-source-watch:
    strategy:
      fail-fast: false
      matrix:
        label: [stable, unstable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1; upstream Nix

      - name: Compare locked and pinned nftables sources
        id: source
        shell: bash
        run: |
          set -euo pipefail

          locked_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          policy_report=$(nix run "$POLICY" -- validate)
          checker_version=$(jq -er .checkerVersion <<<"$policy_report")
          pin_rev=$(jq -er --arg label "${{ matrix.label }}" '.pins[$label]' <<<"$policy_report")
          pin_uri="github:NixOS/nixpkgs/$pin_rev"
          source_ref=.#packages.x86_64-linux.nftables-source

          locked_source=$(nix build --no-link --print-out-paths "$source_ref")
          pin_source=$(nix build --no-link --print-out-paths \
            --override-input nixpkgs "$pin_uri" \
            "$source_ref")
          test -d "$locked_source"
          test -d "$pin_source"

          locked_version=$(nix eval --raw "$source_ref.version")
          pin_version=$(nix eval --raw \
            --override-input nixpkgs "$pin_uri" \
            "$source_ref.version")
          locked_hash=$(nix hash path --type sha256 --base16 "$locked_source")
          pin_hash=$(nix hash path --type sha256 --base16 "$pin_source")

          printf '%s\n' "$locked_source" >"$RUNNER_TEMP/locked-nftables-source"
          printf '%s\n' "$pin_source" >"$RUNNER_TEMP/pin-nftables-source"
          {
            echo "locked_rev=$locked_rev"
            echo "checker_version=$checker_version"
            echo "pin_rev=$pin_rev"
            echo "locked_version=$locked_version"
            echo "pin_version=$pin_version"
            echo "locked_hash=$locked_hash"
            echo "pin_hash=$pin_hash"
          } >>"$GITHUB_OUTPUT"

          if [ "$locked_hash" = "$pin_hash" ]; then
            echo "drift=false" >>"$GITHUB_OUTPUT"
            echo "No nftables source drift for the ${{ matrix.label }} pin: $locked_version ($locked_hash)."
          else
            echo "drift=true" >>"$GITHUB_OUTPUT"
            echo "nftables source drift for the ${{ matrix.label }} pin: $locked_version ($locked_hash) -> $pin_version ($pin_hash)."
          fi

          {
            echo "### ${{ matrix.label }} nftables source comparison"
            echo
            echo "Pins from nixos-project-policy $checker_version."
            echo
            echo "| | nixpkgs revision | nftables | patched-source SHA-256 |"
            echo "|---|---|---|---|"
            echo "| locked | \`${locked_rev:0:12}\` | \`$locked_version\` | \`${locked_hash:0:16}…\` |"
            echo "| ${{ matrix.label }} pin | \`${pin_rev:0:12}\` | \`$pin_version\` | \`${pin_hash:0:16}…\` |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Close resolved drift issues
        if: steps.source.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED_HASH: ${{ steps.source.outputs.locked_hash }}
          PIN_HASH: ${{ steps.source.outputs.pin_hash }}
        run: |
          set -euo pipefail
          label=nixpkgs-nftables-drift
          label_exists=$(gh label list --limit 1000 --json name \
            | jq -r --arg label "$label" 'any(.[]; .name == $label)')
          if [ "$label_exists" != true ]; then
            echo "No $label label exists; there are no drift issues to close."
            exit 0
          fi

          title_prefix="nixpkgs nftables drift (${{ matrix.label }}): "
          issues=$(gh issue list --state open --label "$label" \
            --limit 100 --json number,title \
            | jq -r --arg prefix "$title_prefix" '.[] | select(.title | startswith($prefix)) | .number')
          if [ -z "$issues" ]; then
            echo "No open ${{ matrix.label }} drift issues need closing."
            exit 0
          fi

          while IFS= read -r issue; do
            gh issue close "$issue" --reason completed --comment \
              "Resolved: the locked and ${{ matrix.label }} pin patched nftables sources now match at ${PIN_HASH:0:12} (locked ${LOCKED_HASH:0:12})."
          done <<<"$issues"

      - name: Diff schema-relevant source files
        if: steps.source.outputs.drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          locked_source=$(<"$RUNNER_TEMP/locked-nftables-source")
          pin_source=$(<"$RUNNER_TEMP/pin-nftables-source")
          files=(
            src/parser_json.c
            src/json.c
            src/meta.c
            src/rt.c
            src/parser_bison.y
            src/scanner.l
            doc/libnftables-json.adoc
          )

          : >parser.diff
          for file in "${files[@]}"; do
            locked_file="$locked_source/$file"
            pin_file="$pin_source/$file"
            [ -e "$locked_file" ] || locked_file=/dev/null
            [ -e "$pin_file" ] || pin_file=/dev/null
            if diff -u \
              --label "locked/$file" "$locked_file" \
              --label "pin/$file" "$pin_file" >>parser.diff; then
              :
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
            fi
          done
          echo "diff bytes: $(wc -c <parser.diff)"

      - name: Upload source diff
        if: steps.source.outputs.drift == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nftables-source-diff-${{ matrix.label }}
          path: parser.diff
          if-no-files-found: error

      - name: AI-assisted drift triage
        if: steps.source.outputs.drift == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_basic_report() {
            local reason=$1
            cat >drift-report.md <<EOF
          # nixpkgs nftables source drift detected

          Pin: ${{ matrix.label }}, from nixos-project-policy \`${{ steps.source.outputs.checker_version }}\`

          - Locked nixpkgs: \`${{ steps.source.outputs.locked_rev }}\`
          - Pinned nixpkgs: \`${{ steps.source.outputs.pin_rev }}\`
          - nftables: \`${{ steps.source.outputs.locked_version }}\` → \`${{ steps.source.outputs.pin_version }}\`
          - Patched source: \`${{ steps.source.outputs.locked_hash }}\` → \`${{ steps.source.outputs.pin_hash }}\`

          $reason The schema-relevant source diff is attached to the workflow run.
          EOF
          }

          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            write_basic_report "AI triage was skipped because no \`ANTHROPIC_API_KEY\` secret is configured."
          elif ! bash tooling/drift-triage.sh \
            --diff parser.diff \
            --schema-dir lib/schema \
            --spec-coverage docs/spec-coverage.md \
            --old-source "nixpkgs:${{ steps.source.outputs.locked_hash }}" \
            --new-source "${{ matrix.label }} pin:${{ steps.source.outputs.pin_hash }}" \
            --out drift-report.md; then
            write_basic_report "AI triage failed; the deterministic source comparison remains authoritative."
          fi

      - name: File or update drift issue
        if: steps.source.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_HASH: ${{ steps.source.outputs.pin_hash }}
        run: |
          set -euo pipefail
          title_prefix="nixpkgs nftables drift (${{ matrix.label }}): "
          title="$title_prefix${PIN_HASH:0:12}"
          gh label create nixpkgs-nftables-drift --color FBCA04 \
            --description "A policy pin carries nftables source different from the lock" 2>/dev/null || true
          open_issues=$(gh issue list --state open --label nixpkgs-nftables-drift \
            --limit 100 --json number,title)
          current=$(jq -r --arg title "$title" \
            '[.[] | select(.title == $title)][0].number // empty' <<<"$open_issues")
          if [ -n "$current" ]; then
            echo "Issue #$current already tracks $PIN_HASH; appending a fresh report."
            gh issue comment "$current" --body-file drift-report.md
          else
            url=$(gh issue create --title "$title" --label nixpkgs-nftables-drift --body-file drift-report.md)
            current=${url##*/}
          fi

          # The current pin supersedes older drift issues for this label.
          superseded=$(jq -r --arg prefix "$title_prefix" --arg title "$title" \
            '.[] | select((.title | startswith($prefix)) and .title != $title) | .number' \
            <<<"$open_issues")
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue close "$issue" --reason "not planned" --comment \
              "Superseded by #$current: the ${{ matrix.label }} pin now carries patched source ${PIN_HASH:0:12}."
          done <<<"$superseded"

